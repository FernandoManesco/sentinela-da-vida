# =========================================================================
# nuvem/nginx-app.conf — trecho de configuração do nginx para o Sentinela Monitor.
# Onde roda: servidor T-140 (nginx). Não é um arquivo completo: cole dentro do bloco
#   server { } HTTPS (listen 443) do site sentineladavida.
# Conexões: encaminha https://www.sentineladavida.com.br/app/... para o FastAPI de
#   nuvem/app.py (uvicorn em 127.0.0.1:8090, serviço sentinela-cloud.service).
#   proxy_pass sem barra final preserva o prefixo /app, que o APIRouter do app.py espera.
# =========================================================================
    # ---- Sentinela Monitor (FastAPI em 127.0.0.1:8090) ----
    # cole DENTRO do bloco server { ... } HTTPS do site sentineladavida (listen 443)
    # Proxy reverso: repassa host, IP e protocolo originais ao FastAPI.
    location /app/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # /app sem barra -> /app/ (redirecionamento permanente).
    location = /app { return 301 /app/; }
